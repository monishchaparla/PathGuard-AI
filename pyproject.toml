[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathguard-ai"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "h3>=4.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "streamlit>=1.28",
    "pydeck>=0.8",
    "PyMuPDF>=1.23",
    "numpy>=1.24",
    "shapely>=2.0",
    "geojson>=3.0",
    "Pillow>=10.0",
    "PyYAML>=6.0"
]
